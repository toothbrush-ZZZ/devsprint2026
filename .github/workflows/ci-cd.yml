name: Cafeteria CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1 — LINT & TEST all services
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - identity-provider
          - stock-service
          - order-gateway
          - kitchen-queue
          - notification-hub

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: cafeteria_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: ${{ matrix.service }}
        env:
          DB_NAME: cafeteria_test
          DB_USER: user
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379
          DJANGO_SECRET_KEY: test-secret-key-ci
        run: |
          python manage.py makemigrations
          python manage.py migrate --run-syncdb

      - name: Run tests
        working-directory: ${{ matrix.service }}
        env:
          DB_NAME: cafeteria_test
          DB_USER: user
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379
          DJANGO_SECRET_KEY: test-secret-key-ci
          IDENTITY_PROVIDER_URL: http://localhost:8001
          STOCK_SERVICE_URL: http://localhost:8002
          ORDER_GATEWAY_URL: http://localhost:8003
          KITCHEN_QUEUE_URL: http://localhost:8004
          NOTIFICATION_HUB_URL: http://localhost:8005
        run: python manage.py test --verbosity=2

  # ──────────────────────────────────────────────────────────────────
  # JOB 2 — BUILD Docker images (only on push to main/develop)
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - identity-provider
          - stock-service
          - order-gateway
          - kitchen-queue
          - notification-hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cafeteria-${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/cafeteria-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # JOB 3 — INTEGRATION TEST with full docker-compose stack
  # ──────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start full stack
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check all health endpoints
        run: |
          curl -f http://localhost:8001/health/ || exit 1
          curl -f http://localhost:8002/health/ || exit 1
          curl -f http://localhost:8003/health/ || exit 1
          curl -f http://localhost:8004/health/ || exit 1
          curl -f http://localhost:8005/health/ || exit 1
          echo "All services healthy!"

      - name: Run integration smoke test
        run: |
          # Register a student
          TOKEN=$(curl -s -X POST http://localhost:8001/login/ \
            -H "Content-Type: application/json" \
            -d '{"student_id":"210041001","password":"password123"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          echo "Got token: ${TOKEN:0:20}..."

          # Check menu loads
          curl -f -H "Authorization: Bearer $TOKEN" \
            http://localhost:8002/items/ || exit 1

          # Place a test order
          STATUS=$(curl -s -X POST http://localhost:8003/order/ \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"item_id":1}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','error'))")

          echo "Order status: $STATUS"
          if [ "$STATUS" == "error" ]; then exit 1; fi

          echo "Integration tests passed!"

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --tail=50

      - name: Tear down
        if: always()
        run: docker compose down -v