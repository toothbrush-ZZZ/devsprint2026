name: DevSprint CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-order-gateway:
    name: Test Order Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./order-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: order-gateway/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  test-stock-service:
    name: Test Stock Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./stock-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: stock-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  test-identity-provider:
    name: Test Identity Provider
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./identity-provider
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: identity-provider/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-order-gateway, test-stock-service, test-identity-provider]
    # Only build images after ALL tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Build all images
        run: docker compose build

      - name: Notify success
        run: echo "✅ All tests passed and images built successfully!"
