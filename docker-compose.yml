
services:

  # ─────────────────────────────────────────
  # INFRASTRUCTURE
  # PostgreSQL database and Redis cache
  # All services depend on these two
  # ─────────────────────────────────────────

  db:
    image: postgres:15
    # Official PostgreSQL image — no Dockerfile needed
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # Named volume — data persists between docker-compose down/up
      # Without this, database resets every time you restart
    ports:
      - "5432:5432"
      # Expose to host so you can connect with a DB client if needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Docker waits until postgres is actually ready before
      # starting services that depend on it

  redis:
    image: redis:7-alpine
    # Alpine = smaller image, same functionality
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────
  # SERVICE 1: Identity Provider — port 8001
  # Handles login, JWT tokens
  # ─────────────────────────────────────────

  identity-provider:
    build: ./identity-provider
    # Build using identity-provider/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-devsprint2026
      - DB_NAME=identity_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      # "db" is the service name above — Docker DNS resolves it
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      # "redis" is the service name — same DNS magic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for db and redis healthchecks to pass
      # Before this: services would crash trying to connect

  # ─────────────────────────────────────────
  # SERVICE 2: Stock Service — port 8002
  # Fixed menu management, meal periods, variants
  # ─────────────────────────────────────────

  stock-service:
    build: ./stock-service
    ports:
      - "8002:8002"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-devsprint2026
      - DB_NAME=stock_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      - IDENTITY_PROVIDER_URL=http://identity-provider:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # SERVICE 3: Order Gateway — port 8003
  # Coordinates all services, student orders
  # ─────────────────────────────────────────

  order-gateway:
    build: ./order-gateway
    ports:
      - "8003:8003"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-devsprint2026
      - DB_NAME=order_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      - IDENTITY_PROVIDER_URL=http://identity-provider:8001
      - STOCK_SERVICE_URL=http://stock-service:8002
      - KITCHEN_QUEUE_URL=http://kitchen-queue:8004
      - NOTIFICATION_HUB_URL=http://notification-hub:8005
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # SERVICE 4: Kitchen Queue — port 8004
  # Async order processing, kitchen staff
  # ─────────────────────────────────────────

  kitchen-queue:
    build: ./kitchen-queue
    ports:
      - "8004:8004"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-devsprint2026
      - DB_NAME=kitchen_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      - ORDER_GATEWAY_URL=http://order-gateway:8003
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────
  # SERVICE 5: Notification Hub — port 8005
  # WebSockets, real-time push notifications
  # Uses daphne (ASGI) instead of runserver
  # ─────────────────────────────────────────

  notification-hub:
    build: ./notification-hub
    ports:
      - "8005:8005"
    environment:
      - DJANGO_SECRET_KEY=django-insecure-devsprint2026
      - DB_NAME=notification_db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
# ─────────────────────────────────────────
  # FRONTEND — React + Vite — port 3000
  # Student UI + Admin Dashboard
  # ─────────────────────────────────────────

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - identity-provider
      - stock-service
      - order-gateway
      - kitchen-queue
      - notification-hub

volumes:
  postgres_data:
  # Named volume keeps database data between restarts
  # Without this: all data lost every docker-compose down

