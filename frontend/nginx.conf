server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend services
    location /api/identity/ {
        proxy_pass http://identity-provider:8001/;
        proxy_set_header Host $host;
    }
    location /api/stock/ {
        proxy_pass http://stock-service:8002/;
        proxy_set_header Host $host;
    }
    location /api/order/ {
        proxy_pass http://order-gateway:8003/;
        proxy_set_header Host $host;
    }
    location /api/kitchen/ {
        proxy_pass http://kitchen-queue:8004/;
        proxy_set_header Host $host;
    }
    location /api/notify/ {
        proxy_pass http://notification-hub:8005/;
        proxy_set_header Host $host;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://notification-hub:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}